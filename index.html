<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camp Spending Tracker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Camp ledger</p>
        <h1>Spending Tracker</h1>
      </div>
      <div class="header-actions">
        <button id="exportCsvBtn" class="secondary-button" type="button">Export CSV</button>
        <label class="secondary-button file-button">
          Import CSV
          <input id="importCsvInput" type="file" accept=".csv,text/csv">
        </label>
        <button id="sampleBtn" class="ghost-button" type="button">Load Sample</button>
      </div>
    </header>

    <main class="app-shell">
      <section class="summary-band" aria-label="Camp spending summary">
        <div>
          <span>Total campers</span>
          <strong id="totalCampers">0</strong>
        </div>
        <div>
          <span>Total deposits</span>
          <strong id="totalDeposits">$0.00</strong>
        </div>
        <div>
          <span>Total spent</span>
          <strong id="totalSpent">$0.00</strong>
        </div>
        <div>
          <span>Remaining funds</span>
          <strong id="totalRemaining">$0.00</strong>
        </div>
      </section>

      <section class="controls-band" aria-label="Controls">
        <div class="search-wrap">
          <label for="searchInput">Search campers</label>
          <input id="searchInput" type="search" placeholder="Name, cabin, or group">
        </div>
        <div class="select-wrap">
          <label for="statusFilter">Balance</label>
          <select id="statusFilter">
            <option value="all">All balances</option>
            <option value="positive">Has funds</option>
            <option value="low">Low funds</option>
            <option value="zero">Zero or overdrawn</option>
          </select>
        </div>
        <button id="addCamperBtn" class="primary-button" type="button">Add Camper</button>
      </section>

      <section class="workspace">
        <aside class="camper-list-panel" aria-label="Campers">
          <div class="panel-title-row">
            <h2>Campers</h2>
            <span id="visibleCount">0 shown</span>
          </div>
          <div id="camperList" class="camper-list"></div>
        </aside>

        <section class="detail-panel" aria-label="Selected camper details">
          <div id="emptyState" class="empty-state">
            <h2>No camper selected</h2>
            <p>Add a camper or choose one from the list to record deposits and purchases.</p>
          </div>

          <div id="camperDetail" class="camper-detail" hidden>
            <div class="detail-header">
              <div>
                <p id="detailMeta" class="eyebrow">Camper</p>
                <h2 id="detailName">Camper Name</h2>
              </div>
              <div class="balance-card">
                <span>Current balance</span>
                <strong id="detailBalance">$0.00</strong>
              </div>
            </div>

            <form id="camperForm" class="edit-grid">
              <label>
                Camper name
                <input id="camperName" required>
              </label>
              <label>
                Cabin or group
                <input id="camperCabin" placeholder="Cabin 4">
              </label>
              <label>
                Guardian contact
                <input id="camperGuardian" placeholder="Name or phone">
              </label>
              <button class="secondary-button" type="submit">Save Camper</button>
            </form>

            <div class="ledger-layout">
              <form id="transactionForm" class="transaction-form">
                <h3>Record Activity</h3>
                <label>
                  Type
                  <select id="transactionType">
                    <option value="deposit">Deposit</option>
                    <option value="purchase">Purchase</option>
                    <option value="refund">Refund</option>
                    <option value="adjustment">Adjustment</option>
                  </select>
                </label>
                <label>
                  Amount
                  <input id="transactionAmount" type="number" min="0.01" step="0.01" required>
                </label>
                <label>
                  Date
                  <input id="transactionDate" type="date" required>
                </label>
                <label>
                  Note
                  <input id="transactionNote" placeholder="Snack bar, camp store, allowance">
                </label>
                <button class="primary-button" type="submit">Add Entry</button>
              </form>

              <div class="ledger-panel">
                <div class="panel-title-row">
                  <h3>Ledger</h3>
                  <button id="clearCamperBtn" class="danger-button" type="button">Remove Camper</button>
                </div>
                <div id="ledgerRows" class="ledger-rows"></div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <template id="camperRowTemplate">
      <button class="camper-row" type="button">
        <span class="camper-row-main">
          <strong></strong>
          <small></small>
        </span>
        <span class="camper-row-balance"></span>
      </button>
    </template>

    <template id="ledgerRowTemplate">
      <div class="ledger-row">
        <div>
          <strong></strong>
          <small></small>
        </div>
        <span></span>
        <button class="icon-button" type="button" aria-label="Delete entry">×</button>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
